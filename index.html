  .progress-track{ background:var(--grid); border-radius:6px; height:8px; overflow:hidden; margin-top:6px; }
  .progress-fill{ background:var(--series-keisan); height:100%; border-radius:6px; }
  .barchart{ display:flex; align-items:flex-end; gap:4px; height:110px; margin-top:10px; position:relative; }

  .theme-toggle{ margin-top:auto; font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; text-align:left; padding:9px 10px; }

/* 全角数字→半角、中点（・）の有無、小さいカナ（ェ/ゃ等）の表記ゆれを吸収してから比較する
   （Studyingのファイル名と項目名で、全角数字・中点・「ソフトウエア/ソフトウェア」のような表記が揺れることがあるため） */
const SMALL_KANA_MAP = {'ェ':'エ','ャ':'ヤ','ュ':'ユ','ョ':'ヨ','ッ':'ツ','ぇ':'え','ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ'};
function normalizeForMatch(s){
  let out = String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  out = out.replace(/・/g, '');
  out = out.replace(/[ェャュョッぇゃゅょっ]/g, c => SMALL_KANA_MAP[c] || c);
  return out;
}
/* 項目名の先頭の「NN_」を取り除いて、ファイル名比較用のキーワードにする（「〜手続き」→「〜手続」の表記ゆれも許容） */
function itemKeywordVariants(name){
  const kw = normalizeForMatch(String(name).replace(/^\d+_/, ''));
  const variants = [kw];
  if (kw.endsWith('き')) variants.push(kw.slice(0, -1));
  return variants;
}
/* ファイル名のうち、括弧（内容説明）より前の「章タイトル」部分だけを取り出す。
   括弧内の説明文には他の項目のキーワードが説明・参照として出てくることがあり（例：外貨換算会計の説明文に「有価証券」が出てくる）、
   括弧の中まで比較対象にすると無関係な項目にファイルが誤って紐づいてしまうため、章タイトル部分のみで判定する */
function fileTitlePart(filename){
  const idx = String(filename).search(/[（(]/);
  return idx === -1 ? filename : filename.slice(0, idx);
}
/* 項目名先頭の数字（章番号）を取り出し、ファイル名の中に埋め込まれた章番号タグと直接突き合わせる。
   理論学習フォルダのように、ファイル名に固有のタグ（【財T_N】など）で章番号が入っている場合に使う
   （キーワードの部分一致だと、「財務諸表」が「四半期財務諸表に関する会計基準」に含まれてしまう等、
   短い項目名が無関係な章に誤って一致することがあるため、番号タグでの厳密一致にしている） */
function matchingByChapterTag(list, name, tagRegex){
  if (!list) return [];
  const m = String(name).match(/^(\d+)_/);
  if (!m) return [];
  const chapterNum = parseInt(m[1], 10);
  return list.filter(f => {
    const fm = String(f).match(tagRegex);
    return fm && parseInt(fm[1], 10) === chapterNum;
  });
}
/* この項目名に該当するダウンロード済みファイルを返す（該当カテゴリにファイル一覧が無ければ空配列） */
function matchingFiles(categoryId, name){
  if (categoryId === 'cat_riron_gakushu') return matchingByChapterTag(RIRON_GAKUSHU_PDF_LIST, name, /第(\d+)章/);
  const list = FILE_LISTS[categoryId];
  if (!list) return [];
  const variants = itemKeywordVariants(name).filter(Boolean);
  if (!variants.length) return [];
  return list.filter(f => { const nf = normalizeForMatch(fileTitlePart(f)); return variants.some(kw => nf.includes(kw)); });
}

}
/* Studyingで確認済みの項目一覧を反映する。新規作成時だけでなく、既存の保存データを読み込んだ際にも呼び出すことで、
   ダウンロード状況やアプリの更新に応じて項目を後から追加できる（既存の学習履歴・進捗は変更しない）。 */
function seedDefaultItems(items){
  REAL_KIHON_KEISAN.forEach(name => pushItemWithMirrors(items, 'cat_kihon_keisan', name));
  REAL_KIHON_RIRON.forEach(name => pushItemWithMirrors(items, 'cat_kihon_riron', name));
  THEME_KEISAN.forEach((name, i) => pushIfMissing(items, 'cat_theme', 'テーマ別演習'+(i+1)+'（簿記）'+name));
  THEME_ZAIHYO.forEach((name, i) => pushIfMissing(items, 'cat_theme', 'テーマ別演習'+(i+1)+'（財表）'+name));
  for (let n = 1; n <= 5; n++){
    pushIfMissing(items, 'cat_jitsuryoku', '簿記論 実力テスト第'+n+'回');
    pushIfMissing(items, 'cat_jitsuryoku', '財表 実力テスト第'+n+'回');
  }
  for (let n = 1; n <= 9; n++){
    const label = n <= 3 ? '（過去問演習）' : '（答案練習）';
    pushIfMissing(items, 'cat_chokuzen', '簿記論 直前対策講座'+n+label);
    pushIfMissing(items, 'cat_chokuzen', '財表 直前対策講座'+n+label);
  }
  SELECT_KAKOMON_BOKI.forEach(([num, name]) => pushIfMissing(items, 'cat_select', '簿記論 セレクト過去問（テーマ'+num+'：'+name+'）'));
  pushIfMissing(items, 'cat_select', '財表 セレクト過去問集');
}

function ensureShape(){
  // 古い保存データにはまだ無いカテゴリ（スマート問題集など）を補う
  DEFAULT_CATEGORIES.forEach(dc => {
    if (!state.categories.some(c => c.id === dc.id)) state.categories.push(Object.assign({}, dc));
  });
  if (!Array.isArray(state.notes)) state.notes = [];
  state.items.forEach(i => {
    if (!Array.isArray(i.problems)) i.problems = [];
    if (!Array.isArray(i.scoreHistory)) i.scoreHistory = [];
    if (i.lastScore === undefined) i.lastScore = null;
    if (i.lastMaxScore === undefined) i.lastMaxScore = null;
    i.problems.forEach(p => {
      if (!Array.isArray(p.scoreHistory)) p.scoreHistory = [];
      if (p.lastScore === undefined) p.lastScore = null;
      if (p.lastMaxScore === undefined) p.lastMaxScore = null;
    });
  });
  // スマート問題集など、ダウンロードできないため廃止したカテゴリを整理する。
  // 学習記録が無い項目はすべて削除し、その結果0件になったカテゴリは一覧から外す（学習記録が残っている項目・カテゴリは安全のため残す）
  RETIRED_CATEGORY_IDS.forEach(catId => {
    state.items = state.items.filter(i => {
      if (i.categoryId !== catId) return true;
      const untouched = i.totalReviews === 0 && (!i.scoreHistory || i.scoreHistory.length === 0) && (!i.problems || i.problems.length === 0);
      return !untouched;
    });
    if (!state.items.some(i => i.categoryId === catId)) {
      state.categories = state.categories.filter(c => c.id !== catId);
    }
  });
  // 以前の（より細かい章単位の）自動追加項目のうち、一度も学習記録が無いものは新しい項目一覧に統合するため削除する
  // （手動で追加した項目や、学習記録のある項目は残す）
  const LEGACY_CATS = {
    cat_kihon_keisan: LEGACY_KIHON_KEISAN_NAMES, cat_smart_keisan: LEGACY_KIHON_KEISAN_NAMES, cat_training_keisan: LEGACY_KIHON_KEISAN_NAMES,
    cat_kihon_riron: LEGACY_KIHON_RIRON_NAMES, cat_smart_riron: LEGACY_KIHON_RIRON_NAMES, cat_training_riron: LEGACY_KIHON_RIRON_NAMES,
  };
  state.items = state.items.filter(i => {
    const legacyNames = LEGACY_CATS[i.categoryId];
    if (!legacyNames || !legacyNames.includes(i.name)) return true;
    const untouched = i.totalReviews === 0 && (!i.scoreHistory || i.scoreHistory.length === 0) && (!i.problems || i.problems.length === 0);
    return !untouched; // untouchedなら削除（falseを返す）、学習記録があれば残す
  });
  // Studyingで新たに確認できた項目を、既存の学習履歴を壊さずに追記する
  seedDefaultItems(state.items);
}

/* 項目管理タブでカテゴリごとに折りたたんでいるかどうか（保存データには含めない、表示上だけの状態）。
   既定では全カテゴリを折りたたんだ状態にして、開いたときだけその項目一覧が表示されるようにする */

/* ===================== 忘却曲線スケジューリング ===================== */
function scheduleNext(item, rating, fromDateISO){
  let intervalDays;
  if (rating <= 2){
    item.streak = 0;
    intervalDays = 1;
  } else {
    const idx = Math.min(item.streak, BASE_INTERVALS.length - 1);
    const factor = rating === 3 ? 1 : rating === 4 ? 1.3 : 1.6;
    intervalDays = Math.max(1, Math.round(BASE_INTERVALS[idx] * factor));
    item.streak += 1;
  }
  item.totalReviews += 1;
  item.lastRating = rating;
  item.lastStudiedAt = fromDateISO;
  item.intervalDays = intervalDays;
  item.nextReviewAt = addDaysISO(fromDateISO, intervalDays);
}
function statusOf(item){
  if (item.totalReviews === 0) return '未着手';
  if (item.streak === 0) return '再学習中';
  if (item.streak <= 2) return '復習中';
  return '定着';
}
function statusBadgeClass(status){
  if (status === '定着') return 'good';
  if (status === '再学習中') return 'critical';
  if (status === '未着手') return 'muted';
  return 'warning';
}

/* ===================== セッション記録 ===================== */
function recordScore(node, date, score, maxScore){
  node.lastScore = score;
  node.lastMaxScore = maxScore;
  node.scoreHistory.push({ date, score, maxScore });
}
function addSession({date, categoryId, itemId, problemId, minutes, rating, score, maxScore, note, activityType}){
  const cat = state.categories.find(c => c.id === categoryId);
  const session = { id: uid('ses'), date, categoryId, itemId: itemId || null, problemId: problemId || null,
    kind: cat ? cat.kind : null, minutes: Math.round(minutes), rating: rating || null,
    score: (score === null || score === undefined || score === '') ? null : Number(score),
    maxScore: (maxScore === null || maxScore === undefined || maxScore === '') ? null : Number(maxScore),
    note: note || '', activityType: activityType || (cat ? ACTIVITY_TYPE_BY_CATEGORY[cat.id] : null) || null };
  state.sessions.push(session);
  if (itemId){
    const item = state.items.find(i => i.id === itemId);
    if (item){
      item.totalMinutes += session.minutes;
      if (problemId){
        // 特定の問題を指定した場合は、その問題単位で忘却曲線・得点を管理する（項目全体の進捗は変更しない）
        const prob = item.problems.find(p => p.id === problemId);
        if (prob){
          prob.totalMinutes += session.minutes;
          if (rating) scheduleNext(prob, rating, date);
          if (session.score !== null) recordScore(prob, date, session.score, session.maxScore);
        }
      } else {
        if (rating) scheduleNext(item, rating, date);
        if (session.score !== null) recordScore(item, date, session.score, session.maxScore);
      }
    }
  }
  markDirty();
}
function deleteSession(id){
  state.sessions = state.sessions.filter(s => s.id !== id);
  markDirty();
}

/* ===================== 集計ヘルパー ===================== */
/* 「問題」を持つ項目はその問題単位で、持たない項目は項目そのものを復習対象の最小単位（リーフ）として扱う */
function leavesOfItem(item){
  if (item.problems && item.problems.length){
    return item.problems.map(p => ({ node: p, item, label: item.name + ' - ' + p.name }));
  }
  return [{ node: item, item, label: item.name }];
}
function allLeaves(){ return state.items.flatMap(leavesOfItem); }
function itemsInPlay(){
  return allLeaves().filter(l => { const c = state.categories.find(c=>c.id===l.item.categoryId); return c && !c.excluded; });
}
function dueItems(){
  const t = todayISO();
  return allLeaves().filter(l => l.node.nextReviewAt && l.node.nextReviewAt <= t)
    .sort((a,b) => a.node.nextReviewAt < b.node.nextReviewAt ? -1 : 1);
}
function totalMinutesOn(dateISO){ return state.sessions.filter(s => s.date === dateISO).reduce((a,s)=>a+s.minutes,0); }
function totalMinutesAll(){ return state.sessions.reduce((a,s)=>a+s.minutes,0); }
function studyStreakDays(){
  let streak = 0; let d = todayISO();
  const daysWithStudy = new Set(state.sessions.map(s=>s.date));
  // 今日まだ記録がなければ昨日から数える
  if (!daysWithStudy.has(d)) d = addDaysISO(d, -1);
  while (daysWithStudy.has(d)){ streak++; d = addDaysISO(d, -1); }
  return streak;
}
function categoryName(id){ const c = state.categories.find(c=>c.id===id); return c ? c.name : '(不明)'; }
function categoryKind(id){ const c = state.categories.find(c=>c.id===id); return c ? c.kind : null; }
function itemName(id){ const i = state.items.find(i=>i.id===id); return i ? i.name : null; }
function findItem(id){ return state.items.find(i=>i.id===id); }
function findProblem(itemId, problemId){ const i = findItem(itemId); return i ? i.problems.find(p=>p.id===problemId) : null; }
function itemAndProblemLabel(itemId, problemId){
  const i = findItem(itemId);
  if (!i) return '';
  if (!problemId) return i.name;
  const p = findProblem(itemId, problemId);
  return p ? (i.name + ' - ' + p.name) : i.name;
}

function renderDashboard(){
  const today = todayISO();
  const due = dueItems();
  const overdue = due.filter(i => i.nextReviewAt < today);
  const todayCount = due.filter(i => i.nextReviewAt === today).length;
  const streak = studyStreakDays();
  const inPlay = itemsInPlay();
  const mastered = inPlay.filter(l => statusOf(l.node) === '定着').length;

  let bars = '';
  let max = 1;
  const days = [];
  for (let k=13;k>=0;k--){ const d = addDaysISO(today,-k); const m = totalMinutesOn(d); days.push({d,m}); if (m>max) max = m; }
  days.forEach(({d,m}) => {
    const h = Math.max(2, Math.round((m/max)*100));
    const label = d.slice(5).replace('-','/');
    bars += '<div class="col"><div class="bar" style="height:'+h+'%" data-tip="'+label+' ・ '+formatMinutes(m)+'"></div><small>'+(d===today?'今日':label.slice(-2))+'</small></div>';
  });

  let reviewHtml = '';
  if (due.length === 0){
    reviewHtml = '<div class="empty">今日の復習対象はありません。新しい項目を学習するか、項目管理タブから追加してください。</div>';
  } else {
    reviewHtml = due.slice(0,8).map(l => {
      const od = daysBetween(l.node.nextReviewAt, today);
      const badge = od > 0 ? '<span class="badge critical">'+od+'日遅れ</span>' : '<span class="badge warning">今日</span>';
      return '<div class="review-item"><div><div class="name">'+escapeHtml(l.label)+'</div><div class="meta">'+escapeHtml(categoryName(l.item.categoryId))+' ・ '+l.node.streak+'回連続成功</div></div>'+badge+'</div>';
    }).join('');
  }

  main.innerHTML = ''
    + '<h1>ダッシュボード</h1>'
    + '<div class="sub">' + today + ' 時点</div>'
    + '<div id="saveBanner" class="banner"></div>'
    + '<div class="grid cols-4">'
    +   statTile('今日の学習時間', formatMinutes(totalMinutesOn(today)))
    +   statTile('累計学習時間', formatMinutes(totalMinutesAll()))
    +   statTile('学習継続日数', streak + '日')
    +   statTile('今日の復習対象', todayCount + overdue.length + '件', overdue.length ? overdue.length+'件が遅延' : '遅延なし')
    + '</div>'
    + '<div class="grid cols-2">'
    +   '<div class="card"><h2>直近14日間の学習時間</h2><div class="barchart">' + bars + '</div></div>'
    +   '<div class="card"><h2>今日の復習提案（忘却曲線ベース）</h2>' + reviewHtml + '</div>'
    + '</div>'
    + '<div class="card"><h2>対象範囲の進捗（直前対策講座・セレクト過去問を除く）</h2>'
    +   progressRow('定着した項目', mastered, inPlay.length)
    + '</div>';

  renderSaveBanner();
  attachBarTooltips();
}

function statTile(label, value, sub){
  return '<div class="stat-tile"><div class="label">'+label+'</div><div class="value">'+value+'</div>'
    + (sub ? '<div class="label" style="margin-top:4px;">'+sub+'</div>' : '') + '</div>';
}
function progressRow(label, done, total){
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  return '<div style="margin-bottom:4px; font-size:13px;">'+label+'：'+done+' / '+total+'（'+pct+'%）</div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
}
function formatScore(node){
  if (node.lastScore === null || node.lastScore === undefined) return null;
  const pct = node.lastMaxScore ? Math.round((node.lastScore/node.lastMaxScore)*100) : null;
  return node.lastScore + (node.lastMaxScore ? '/'+node.lastMaxScore : '') + (pct !== null ? '（'+pct+'%）' : '');
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function attachBarTooltips(){
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('.barchart .bar').forEach(bar => {
    bar.addEventListener('mouseenter', e => { tip.textContent = bar.dataset.tip; tip.style.display='block'; });
    bar.addEventListener('mousemove', e => { tip.style.left = (e.clientX+10)+'px'; tip.style.top = (e.clientY+10)+'px'; });
    bar.addEventListener('mouseleave', () => { tip.style.display='none'; });
  });
}

    if (timer.running){ total += Date.now() - timer.startedAt; clearInterval(timer.tickHandle); }
    timer.running = false; timer.elapsedMs = 0; timer.startedAt = null;
    const minutes = Math.max(1, Math.round(total/60000));
    document.querySelector('#logForm [name="minutes"]').value = minutes;
    updateTimerDisplay(true);
    document.getElementById('logForm').scrollIntoView({behavior:'smooth'});
  });
  updateTimerDisplay();
}
function updateTimerDisplay(reset){
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  let ms = reset ? 0 : timer.elapsedMs + (timer.running ? Date.now() - timer.startedAt : 0);
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  el.textContent = pad(h)+':'+pad(m)+':'+pad(s);
}

    +   '<h2>読み込み</h2>'
    +   '<p class="sub" style="margin-bottom:8px;">以前保存したJSONファイルを読み込みます（現在のデータは上書きされます）。</p>'
    +   '<input type="file" id="importInput" accept="application/json">'
    + '</div>';

  renderSaveBanner();

  document.getElementById('exportBtn').addEventListener('click', async () => {
    state.meta.lastSaved = new Date().toLocaleString('ja-JP');
    const stamp = todayISO().replace(/-/g,'') + '-' + pad(new Date().getHours()) + pad(new Date().getMinutes());
    const filename = 'study-data-' + stamp + '.json';
    const jsonStr = JSON.stringify(state, null, 2);

    /* 対応しているブラウザ（Chrome/Edgeなど）では、保存先のフォルダをそのつど選べる「名前を付けて保存」ダイアログを使う。
       未対応のブラウザや、ダイアログの表示に失敗した場合は、従来通りダウンロードフォルダへの保存にフォールバックする */
    if (window.showSaveFilePicker){
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: 'JSON', accept: {'application/json': ['.json']} }],
        });
        const writable = await handle.createWritable();
        await writable.write(jsonStr);
        await writable.close();
        dirty = false;
        renderSaveBanner();
        return;
      } catch (err){
        if (err && err.name === 'AbortError') return; // 保存ダイアログをキャンセルした場合は何もしない
        // それ以外のエラーはフォールバックへ進む
      }
    }
    const blob = new Blob([jsonStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    dirty = false;
    renderSaveBanner();
  });

  document.getElementById('importInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.items)){
          alert('このファイルは対応する形式ではないようです。');
          return;
        }
        state = parsed;
        ensureShape();
        dirty = false;
        render();
      } catch (err){
        alert('読み込みに失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
}

/* ===================== 初期化 ===================== */
document.querySelectorAll('nav button[data-tab]').forEach(b => {
  b.addEventListener('click', () => { currentTab = b.dataset.tab; render(); });
});
document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme');
  html.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
});
window.addEventListener('beforeunload', e => {
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});

render();
</script>
</body>
